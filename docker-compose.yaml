version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: crypto_minio
    restart: always
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Web UI Port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - crypto_network:
        driver: bridge

  postgres:
    image: postgres:16-alpine
    container_name: crypto_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_password
      POSTGRES_DB: crypto_dw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_user -d crypto_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
       crypto_network:
        driver: bridge

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crypto_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
       crypto_network:
        driver: bridge

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect_server
    restart: always
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      - PREFECT_UI_URL=http://localhost:4200/api
    networks:
      crypto_network:
      driver: bridge

volumes:
  minio_data:
  postgres_data:
  pgadmin_data: